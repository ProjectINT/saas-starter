<!-- Email change confirmation, sent to the new (and, with double_confirm_changes, the old) address. -->
<h2>Confirm your new email</h2>
<p>Follow the link to change the email of your account from {{ .Email }} to {{ .NewEmail }}:</p>
<p><a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email_change">Confirm email change</a></p>
<p>If you did not ask for this change, ignore this email and consider changing your password.</p>
